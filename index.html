<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Departure Board</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow-y: scroll;
      background: #000;
    }

    .container {
      width: 100%;
      overflow: auto;
    }

    iframe {
      width: 100%;
      height: 4000px; /* scroll height */
      border: none;
      display: block;
      transform-origin: top left;
    }

    .loading {
      color: white;
      font-family: Arial, sans-serif;
      padding: 10px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="loading">Loading departure board...</div>
  <iframe id="frame"></iframe>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const clusterId = params.get("id");

  const iframe = document.getElementById("frame");

  if (!clusterId) {
    document.body.innerHTML = "<div class='loading'>Missing ClusterID</div>";
  } else {
    const baseUrl = "https://publiccentro.rslepi.co.uk/departureboards/DepartureBoard.aspx";

    function buildUrl() {
      return baseUrl +
        "?ClusterID=" + clusterId +
        "&DepsCount=60" +
        "&refreshInterval=15" +
        "&Height=0" +
        "&_ts=" + new Date().getTime(); // cache-bust
    }

    function loadBoard() {
      iframe.src = buildUrl();
    }

    // ✅ Smart scaling based on device + orientation
    function scaleIframe() {
      const width = window.innerWidth;
      const height = window.innerHeight;

      let scale = 1;

      if (width < 500) {
        scale = 1.35; // small phones
      } else if (width < 900) {
        scale = 1.15; // tablets
      } else {
        scale = 1; // desktop
      }

      // portrait boost
      if (height > width) {
        scale += 0.1;
      }

      iframe.style.transform = "scale(" + scale + ")";
      iframe.style.width = (100 / scale) + "%";
    }

    // initial load
    loadBoard();
    scaleIframe();

    // refresh every 20s (less aggressive = more reliable)
    setInterval(loadBoard, 20000);

    // re-scale on resize / rotation
    window.addEventListener("resize", scaleIframe);
  }
</script>

</body>
</html>
